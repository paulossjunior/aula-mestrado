name: Deploy no GitHub Pages

# Toda mudança que chega na main vai para o ar.
# `workflow_dispatch` fica como escape: republicar sem precisar de um commit novo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verificar e construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Mesma checagem do CI: conteúdo malformado não chega ao ar.
      - name: Checagem de tipos e de schema
        run: npm run check

      # A avaliação promete 30% da nota em laboratórios. Um lab sem encontro no
      # cronograma é nota que o aluno não sabe como cumprir — reprova antes de ir ao ar.
      - name: Conferir os laboratórios contra o cronograma
        run: node scripts/conferir-labs.mjs

      - uses: actions/configure-pages@v5

      - run: npm run build

      - name: Conferir o que vai ser publicado
        run: |
          total=$(find dist -name index.html | wc -l | tr -d ' ')
          echo "páginas geradas: $total"
          test "$total" -eq 25 || { echo "esperava 25 páginas, encontrei $total"; exit 1; }
          test -f dist/.nojekyll || { echo "faltou .nojekyll: o Pages ignoraria _ds/ e _astro/"; exit 1; }
          grep -q 'href="/aula-mestrado/' dist/index.html \
            || { echo "a home não usa o base /aula-mestrado"; exit 1; }

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
