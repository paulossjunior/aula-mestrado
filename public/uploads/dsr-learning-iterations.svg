<text x="610" y="162" font-family="Archivo, system-ui, sans-serif" font-size="9" font-weight="700" fill="#201e1d" opacity="0.55" letter-spacing="1">INVESTIGOU</text>
<text x="610" y="177" font-family="Archivo, system-ui, sans-serif" font-size="12" font-weight="400" fill="#201e1d">Como reduzir esse custo de</text>
