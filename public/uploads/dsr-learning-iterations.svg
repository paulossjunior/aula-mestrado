<text x="894" y="177" font-family="Archivo, system-ui, sans-serif" font-size="12" font-weight="400" fill="#201e1d">Se o artefato é útil e viável</text>
<text x="894" y="190" font-family="Archivo, system-ui, sans-serif" font-size="12" font-weight="400" fill="#201e1d">na prática</text>
<text x="894" y="215" font-family="Archivo, system-ui, sans-serif" font-size="9" font-weight="700" fill="#201e1d" opacity="0.55" letter-spacing="1">PRODUZIU</text>
<text x="894" y="230" font-family="Archivo, system-ui, sans-serif" font-size="12" font-weight="800" fill="#201e1d">Evidência preliminar de</text>
<text x="894" y="243" font-family="Archivo, system-ui, sans-serif" font-size="12" font-weight="800" fill="#201e1d">utilidade e viabilidade</text>
<text x="30" y="394" font-family="Archivo, system-ui, sans-serif" font-size="13" font-weight="800" fill="#201e1d">A pesquisa evolui porque aprende.</text>
