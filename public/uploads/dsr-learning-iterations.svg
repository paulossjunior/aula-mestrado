<text x="610" y="230" font-family="Archivo, system-ui, sans-serif" font-size="12" font-weight="800" fill="#201e1d">Zeppelin</text>
<path d="M 808 193 L 876 193" stroke="#ec3013" stroke-width="2" fill="none" marker-end="url(#ponta-acento)"/>
