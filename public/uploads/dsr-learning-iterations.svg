<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1122 420" width="1122" height="420" role="img" aria-label="Cada iteração parte de algo que precisava ser aprendido, produz um resultado e revela o que ainda falta — e é essa revelação que provoca a iteração seguinte. A dissertação não contém quatro estudos: contém uma cadeia de aprendizado.">
<defs>
