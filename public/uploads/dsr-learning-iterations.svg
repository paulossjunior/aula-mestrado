<text x="561" y="181" font-family="Archivo, system-ui, sans-serif" font-size="10" font-weight="800" fill="#ec3013" text-anchor="middle" letter-spacing="0.6">REVELOU</text>
<text x="561" y="296" font-family="Archivo, system-ui, sans-serif" font-size="11" fill="#ec3013" text-anchor="middle">dificuldades relacionadas ao</text>
