<text x="42" y="215" font-family="Archivo, system-ui, sans-serif" font-size="9" font-weight="700" fill="#201e1d" opacity="0.55" letter-spacing="1">PRODUZIU</text>
<text x="42" y="230" font-family="Archivo, system-ui, sans-serif" font-size="12" font-weight="800" fill="#201e1d">A primeira versão do artefato</text>
