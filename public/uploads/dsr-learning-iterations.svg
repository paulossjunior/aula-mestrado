<text x="277" y="296" font-family="Archivo, system-ui, sans-serif" font-size="11" fill="#ec3013" text-anchor="middle">a necessidade de compreender</text>
<text x="277" y="310" font-family="Archivo, system-ui, sans-serif" font-size="11" fill="#ec3013" text-anchor="middle">melhor as necessidades de</text>
