<text x="845" y="296" font-family="Archivo, system-ui, sans-serif" font-size="11" fill="#ec3013" text-anchor="middle">em paralelo, a necessidade de</text>
<text x="845" y="310" font-family="Archivo, system-ui, sans-serif" font-size="11" fill="#ec3013" text-anchor="middle">cobrir outros processos — que</text>
