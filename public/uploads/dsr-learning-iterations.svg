<rect width="1122" height="420" fill="#f3f2f2"/>
<text x="30" y="52" font-family="Archivo, system-ui, sans-serif" font-size="17" font-weight="900" fill="#201e1d">A cadeia de aprendizado: as quatro Learning Iterations da tese</text>
<text x="30" y="78" font-family="Archivo, system-ui, sans-serif" font-size="12" fill="#201e1d" opacity="0.7">A pesquisa identificou uma dificuldade relacionada ao uso de dados distribuídos em diferentes aplicações.</text>
