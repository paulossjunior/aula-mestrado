<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 998 764" width="998" height="764" role="img" aria-label="Os treze elos da trajetória, distribuídos pelos três ciclos de Hevner. O laço de evidências a decisões de design é o que faz a pesquisa evoluir: cada estudo produz aprendizado, e o aprendizado muda o que vem depois.">
<rect width="998" height="764" fill="#f3f2f2"/>
<text x="30" y="52" font-family="Archivo, system-ui, sans-serif" font-size="17" font-weight="900" fill="#201e1d">A trajetória que o leitor deve conseguir reconstruir</text>
