<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 864" width="610" height="864" role="img" aria-label="Os treze elos da trajetória, distribuídos pelos três ciclos de Hevner. O laço de evidências a decisões de design é o que faz a pesquisa evoluir: cada estudo produz aprendizado, e o aprendizado muda o que vem depois.">
